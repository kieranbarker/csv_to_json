name: data-pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.in
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-sync requirements.txt

      - name: Transform CSV to JSON
        run: python scripts/transform.py

      - name: Run data tests
        run: pytest -q

      - name: Upload generated JSON
        # Only runs on push to main or manual trigger, NOT on PRs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: generated-data
          path: output/people.json
          if-no-files-found: error