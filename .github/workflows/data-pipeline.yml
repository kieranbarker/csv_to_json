name: data-pipeline

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Transform CSV to JSON
        run: python scripts/transform.py

      - name: Run data tests
        run: pytest -q

      - name: Upload generated JSON
        uses: actions/upload-artifact@v7
        with:
          name: generated-data
          path: output/people.json
          if-no-files-found: error
